services:
  oracle:
    image: gvenzl/oracle-free:23
    container_name: pharma-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "1290"  # SYS password (Container Database)
      APP_USER: "pharma"       # Auto-created in PDB FREEPDB1 by image
      APP_USER_PASSWORD: "pharma_pwd"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database:/opt/pharma/database:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  oracle-data:
